<!--
  과학탐구실험2 Ⅰ-4 · 5차시 수업용 — 롤러코스터 한 화면
  =====================================================
  이 파일은 통합본(과학탐구실험2_가상탐구스테이션.html)과 별개로 혼자 선다.
  허브·학번 칸·단계 이동·활동지·PDF·교사 모드가 코드에 아예 없다.
  놀이기구도 롤러코스터 하나뿐이다 — 용수철 진동·드롭 타워·회전 그네·제자리 회전은
  코드에서 지웠다(숨긴 것이 아니다). 6차시 수행평가 장치가 바이킹(단진자)이라
  교과서 35쪽 용수철의 '최고점에서 연직 아래'를 그대로 옮겨 적으면 틀리기 때문이다.

  물리와 그림은 통합본의 코드를 그대로 가져왔다(buildCoaster·prepTrack·Rides.coaster).
  고칠 일이 있으면 통합본 쪽과 함께 봐야 한다.

  외부 파일을 하나도 쓰지 않는다. 인터넷 없이 더블클릭으로 열린다.
  ES5 문법만 쓴다 — 오래된 학교 PC 브라우저에서 스크립트가 통째로 죽지 않게 한다.
-->

<main>

<script>
/* ==========================================================================
   아래 블록은 통합본에서 그대로 가져온 코드다 (색 · 캔버스 맞춤 · 화살표 ·
   트랙 만들기 · 접선과 곡률 · 롤러코스터). 손대지 않는다.
   ========================================================================== */
var C = {
  temp:"#f97316",      /* 온도 = 주황 */
  force:"#dc2626",     /* 압력·힘 = 빨강 */
  accel:"#2563eb",     /* 가속도 = 파랑 */
  speed:"#16a34a",     /* 속도 = 초록 */
  conc:"#0891b2",      /* 농도 = 청록 */
  predict:"#9333ea",   /* 예상 = 보라 */
  predictFill:"rgba(147,51,234,.28)",
  guide:"#9ca3af",     /* 기준선·한계선 = 회색 점선 */
  ink:"#374151", line:"#d7dbe2", faint:"#eef1f5"
};

function fitCanvas(cv, opts){
  opts = opts || {};
  var w = opts.width || cv.clientWidth, h = opts.height || cv.clientHeight;
  if (!w || !h) return null;
  var dpr = opts.scale || Math.min(2.5, window.devicePixelRatio || 1);
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  var g = cv.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);
  g.fillStyle = "#fff"; g.fillRect(0, 0, w, h);
  return { g:g, w:w, h:h };
}

var G = 9.8;

function arrow(g, x, y, dx, dy, color, w){
  var len = Math.hypot(dx, dy);
  if (len < 0.6) return;
  var ux = dx / len, uy = dy / len, head = Math.min(len * 0.42, w * 3.4);
  g.strokeStyle = color; g.fillStyle = color; g.lineWidth = w; g.lineCap = "round";
  g.beginPath(); g.moveTo(x, y); g.lineTo(x + dx - ux * head * 0.7, y + dy - uy * head * 0.7); g.stroke();
  g.beginPath();
  g.moveTo(x + dx, y + dy);
  g.lineTo(x + dx - ux * head + uy * head * 0.42, y + dy - uy * head - ux * head * 0.42);
  g.lineTo(x + dx - ux * head - uy * head * 0.42, y + dy - uy * head + ux * head * 0.42);
  g.closePath(); g.fill();
}

function buildCoaster(){
  /* 직선과 원호를 이어 붙여 접선이 끊기지 않게 만든다.
     이음매에서 접선이 꺾이면 곡률이 무한대가 되어 가속도가 비현실적으로 치솟는다. */
  var pts = [], x = 0, y = 42, hd = 0, ds = 0.4;
  var DEG = Math.PI / 180;
  function straight(len){
    var n = Math.max(1, Math.round(len / ds)), i;
    for (i = 0; i < n; i++) { x += Math.cos(hd) * ds; y += Math.sin(hd) * ds; pts.push({ x:x, y:y }); }
  }
  function arc(R, dth){                       /* dth>0 이면 왼쪽(반시계)으로 휜다 */
    var len = Math.abs(dth) * R, n = Math.max(1, Math.round(len / ds)), i, step = dth / n;
    for (i = 0; i < n; i++) { hd += step; x += Math.cos(hd) * ds; y += Math.sin(hd) * ds; pts.push({ x:x, y:y }); }
  }
  pts.push({ x:x, y:y });
  straight(12);                                /* 출발 평지 */
  arc(12, -37 * DEG);                          /* 마루 곡선 */
  var iA = pts.length - 1;                     /* A — 직선 경사가 시작되는 곳 */
  straight(51.8);                              /* A→B 직선 경사 */
  arc(22, 37 * DEG);                           /* 골짜기 곡선 */
  var iB = pts.length - 1;                     /* B — 골짜기 바닥 */
  straight(10);
  arc(50, 20 * DEG); arc(30, -40 * DEG); arc(50, 20 * DEG);   /* 작은 언덕 */
  straight(14);
  var loopStart = pts.length;
  arc(15, 360 * DEG);                          /* 수직 루프 — 오른쪽으로 올라가 왼쪽으로 내려온다 */
  var loopEnd = pts.length;
  var iC = loopStart + Math.round((loopEnd - loopStart) * 0.75);  /* 270° 지점 = 루프 왼쪽 옆 */
  straight(24);
  return { pts:pts, iA:iA, iB:iB, iC:iC, R:15 };
}

function prepTrack(tr){
  var p = tr.pts, n = p.length, i, a, b, c, T = [], K = [], N = [], s = [0], d;
  for (i = 1; i < n; i++) s.push(s[i-1] + Math.hypot(p[i].x - p[i-1].x, p[i].y - p[i-1].y));
  for (i = 0; i < n; i++) {
    a = p[Math.max(0, i - 1)]; c = p[Math.min(n - 1, i + 1)];
    d = Math.hypot(c.x - a.x, c.y - a.y) || 1;
    T.push({ x:(c.x - a.x) / d, y:(c.y - a.y) / d });
    N.push({ x:-T[i].y, y:T[i].x });          /* 접선을 반시계로 90° 돌린 방향 */
  }
  for (i = 0; i < n; i++) {
    a = p[Math.max(0, i - 1)]; b = p[i]; c = p[Math.min(n - 1, i + 1)];
    var cross = (b.x - a.x) * (c.y - a.y) - (b.y - a.y) * (c.x - a.x);
    var ab = Math.hypot(b.x - a.x, b.y - a.y), bc = Math.hypot(c.x - b.x, c.y - b.y), ca = Math.hypot(c.x - a.x, c.y - a.y);
    var den = ab * bc * ca;
    K.push(den > 1e-9 ? 2 * cross / den : 0);   /* 부호 있는 곡률 */
  }
  tr.T = T; tr.N = N; tr.K = K; tr.s = s; tr.len = s[n-1];
  return tr;
}

/* 놀이기구 — 롤러코스터 하나뿐이다 */
var Rides = {};

Rides.coaster = {
  id:"coaster", label:"롤러코스터", sub:"교과서 37쪽",
  axis:["수평 방향", "연직 방향"], aMax:55,
  note:"에너지 보존으로 속력을 구했어요. 마찰과 공기 저항은 무시했어요.",
  controls:[],
  build: function(){
    var tr = prepTrack(buildCoaster()), p = tr.pts;
    var y0 = p[0].y, v0 = 2, dt = 0.02, fr = [], s = 0, i = 0, t = 0, guard = 0;
    while (i < p.length - 1 && guard++ < 20000) {
      var y = p[i].y, v2 = v0 * v0 + 2 * G * (y0 - y), v = Math.sqrt(Math.max(0.6, v2));
      var at = -G * tr.T[i].y;                      /* 중력의 접선 성분 */
      var ac = v * v * tr.K[i];                     /* 구심 성분(부호 있음) */
      fr.push({ t:t, x:p[i].x, y:y, i:i, v:v,
                vx:tr.T[i].x * v, vy:tr.T[i].y * v,
                ax:at * tr.T[i].x + ac * tr.N[i].x,
                ay:at * tr.T[i].y + ac * tr.N[i].y });
      s += v * dt; t += dt;
      while (i < p.length - 1 && tr.s[i + 1] <= s) i++;
    }
    return { frames:fr, dur:t, view:"track", track:tr };
  },
  draw: function(g, W, H, f, p, built){
    var tr = built.track, pts = tr.pts, i;
    if (!tr.bounds) {
      var bx = [Infinity, -Infinity], by = [Infinity, -Infinity];
      for (i = 0; i < pts.length; i++) {
        bx[0] = Math.min(bx[0], pts[i].x); bx[1] = Math.max(bx[1], pts[i].x);
        by[0] = Math.min(by[0], pts[i].y); by[1] = Math.max(by[1], pts[i].y);
      }
      tr.bounds = { x0:bx[0], x1:bx[1], y0:by[0], y1:by[1] };
    }
    var bd = tr.bounds;
    var sx = W * 0.94 / (bd.x1 - bd.x0), sy = H * 0.80 / (bd.y1 - bd.y0);
    var sc = Math.min(sx, sy), ox = W * 0.03 - bd.x0 * sc, oy = H * 0.90 + bd.y0 * sc;
    function PX(x){ return ox + x * sc; }
    function PY(y){ return oy - y * sc; }
    var n = pts.length, last = n - 1, S = Math.min(W, H);
    /* 지면은 트랙 최저점보다 조금 아래에 둔다. 그래야 낮은 구간에도 기둥이 보인다.
       PX·PY와 sc·ox·oy는 그대로 두고 배경 요소만 아래로 내린다 */
    var gy = PY(bd.y0) + H * 0.05;
    var q, nv, qx, qy, ux, uy;

    /* 하늘 — 호출한 쪽이 찬 회색을 칠해 두므로 화면 전체를 덮는다.
       위가 짙고 아래로 갈수록 옅어져야 지평선 쪽이 멀어 보인다 */
    var sky = g.createLinearGradient(0, 0, 0, gy);
    sky.addColorStop(0, "#c9dceb"); sky.addColorStop(.45, "#e0e9ea");
    sky.addColorStop(.78, "#f0efe4"); sky.addColorStop(1, "#f8f2e4");
    g.fillStyle = sky; g.fillRect(0, 0, W, H);

    /* 먼 산 능선 — 빈 하늘을 메운다. 뒤쪽 겹을 더 옅게 두고 채도를 낮춰
       레일·차량·표지가 계속 주인공으로 남게 한다 */
    function ridge(amp, base, ph, col){
      var j, ry;
      g.fillStyle = col;
      g.beginPath();
      g.moveTo(0, gy);
      for (j = 0; j <= 26; j++) {
        ry = base - amp * (0.42 + 0.58 * Math.sin(j * 0.58 + ph) * Math.sin(j * 0.58 + ph));
        g.lineTo(W * j / 26, ry);
      }
      g.lineTo(W, gy);
      g.closePath(); g.fill();
    }
    ridge(H * 0.20, gy - H * 0.20, 0.7, "rgba(163,180,192,.40)");
    ridge(H * 0.15, gy - H * 0.07, 2.4, "rgba(134,152,156,.46)");

    /* 지평선 안개 — 산 밑동을 흐려 거리를 준다 */
    g.fillStyle = "rgba(248,242,228,.55)";
    g.fillRect(0, gy - H * 0.075, W, H * 0.075);

    /* 구름 — 난수 없이 정해진 자리에 세 덩이만 얹는다 */
    function cloud(ccx, ccy, cs, al){
      g.fillStyle = "rgba(255,255,255," + al + ")";
      g.beginPath(); g.ellipse(ccx - cs * 0.62, ccy + cs * 0.10, cs * 0.48, cs * 0.30, 0, 0, 6.2832); g.fill();
      g.beginPath(); g.ellipse(ccx, ccy - cs * 0.14, cs * 0.66, cs * 0.44, 0, 0, 6.2832); g.fill();
      g.beginPath(); g.ellipse(ccx + cs * 0.58, ccy + cs * 0.08, cs * 0.44, cs * 0.28, 0, 0, 6.2832); g.fill();
      g.beginPath(); g.ellipse(ccx + cs * 0.08, ccy + cs * 0.22, cs * 0.82, cs * 0.22, 0, 0, 6.2832); g.fill();
    }
    cloud(W * 0.20, H * 0.15, S * 0.115, .72);
    cloud(W * 0.62, H * 0.10, S * 0.085, .58);
    cloud(W * 0.86, H * 0.27, S * 0.070, .48);

    /* 지면 — 따뜻한 흙빛 위에 잔디 결을 옅게 얹는다 */
    var grd = g.createLinearGradient(0, gy, 0, H);
    grd.addColorStop(0, "#cec1a0"); grd.addColorStop(1, "#b6a982");
    g.fillStyle = grd; g.fillRect(0, gy, W, H - gy);
    /* 지평선 쪽 잔디 띠 — 트랙이 땅 위에 서 있게 보이게 한다 */
    g.fillStyle = "rgba(118,138,86,.40)";
    g.fillRect(0, gy, W, Math.max(2, (H - gy) * 0.36));
    g.lineCap = "butt";
    g.strokeStyle = "rgba(112,92,58,.40)"; g.lineWidth = Math.max(1, W * 0.0026);
    g.beginPath(); g.moveTo(0, gy); g.lineTo(W, gy); g.stroke();
    g.lineCap = "round";
    g.strokeStyle = "rgba(98,112,64,.28)"; g.lineWidth = Math.max(1, W * 0.002);
    g.beginPath();
    for (i = 0; i < 22; i++) {
      qx = W * ((i * 37) % 100) / 100;
      qy = gy + (H - gy) * (((i * 13) % 6) + 2) / 9;
      g.moveTo(qx, qy); g.lineTo(qx + W * 0.005, qy - (H - gy) * 0.3);
    }
    g.stroke();

    /* 지지 기둥 — 트랙 위 일정 간격에서 지면까지. 루프 구간은 건너뛴다.
       루프는 반지름 R짜리 원 한 바퀴이므로 C(270° 지점)에서 점 개수를 되짚어 구간을 잡는다 */
    var loopN = Math.round(2 * Math.PI * (tr.R || 15) / 0.4);
    var l0 = tr.iC - Math.round(loopN * 0.80), l1 = tr.iC + Math.round(loopN * 0.32);
    var pStep = Math.max(1, Math.round(n / 18)), pw = Math.max(2, W * 0.005);
    g.lineCap = "butt";
    for (i = pStep; i < n; i += pStep) {
      if (i > l0 && i < l1) continue;
      q = pts[i]; qx = PX(q.x); qy = PY(q.y);
      if (gy - qy < S * 0.03) continue;             /* 지면에 너무 붙은 곳엔 기둥을 세우지 않는다 */
      var sp = Math.min(W * 0.018, (gy - qy) * 0.42);
      /* 밑동 그림자 — 기둥이 땅에 박혀 있게 보이게 눌린 타원으로 깐다 */
      g.fillStyle = "rgba(86,72,48,.30)";
      g.beginPath();
      g.ellipse(qx + pw * 0.6, gy + pw * 0.3, sp + pw * 1.6, pw * 0.85, 0, 0, 6.2832);
      g.fill();
      g.strokeStyle = "rgba(118,104,80,.80)"; g.lineWidth = Math.max(1.6, W * 0.0034);
      g.beginPath();
      g.moveTo(qx - sp, gy); g.lineTo(qx - pw * 0.5, qy);
      g.moveTo(qx + sp, gy); g.lineTo(qx + pw * 0.5, qy);
      g.stroke();
      g.strokeStyle = "rgba(118,104,80,.42)"; g.lineWidth = Math.max(1, W * 0.0018);
      g.beginPath();
      g.moveTo(qx - sp, gy); g.lineTo(qx + pw * 0.5, qy);
      g.moveTo(qx + sp, gy); g.lineTo(qx - pw * 0.5, qy);
      g.stroke();
    }

    /* 침목 — 트랙 점을 건너뛰며 법선 방향으로 짧게 긋는다 */
    var hw = Math.max(2.4, W * 0.0055);
    var sStep = Math.max(1, Math.round(n / 56));
    g.strokeStyle = "rgba(112,86,54,.72)"; g.lineWidth = Math.max(1.6, W * 0.0036);
    g.beginPath();
    for (i = 0; i < n; i += sStep) {
      q = pts[i]; nv = tr.N[i]; ux = nv.x; uy = -nv.y;
      qx = PX(q.x); qy = PY(q.y);
      g.moveTo(qx - ux * hw * 1.95, qy - uy * hw * 1.95);
      g.lineTo(qx + ux * hw * 1.95, qy + uy * hw * 1.95);
    }
    g.stroke();

    /* 레일 두 줄 — 한쪽 레일을 따라 갔다가 반대쪽 레일로 되돌아오는 경로 하나로 만든다.
       트랙 점이 수천 개라 전체를 도는 반복을 이 한 번으로 끝낸다 */
    var step = 3;
    g.beginPath();
    for (i = 0; i <= last; i += step) {
      q = pts[i]; nv = tr.N[i];
      qx = PX(q.x) + nv.x * hw; qy = PY(q.y) - nv.y * hw;
      if (i === 0) g.moveTo(qx, qy); else g.lineTo(qx, qy);
    }
    q = pts[last]; nv = tr.N[last];
    g.lineTo(PX(q.x) + nv.x * hw, PY(q.y) - nv.y * hw);
    g.lineTo(PX(q.x) - nv.x * hw, PY(q.y) + nv.y * hw);
    for (i = last; i >= 0; i -= step) {
      q = pts[i]; nv = tr.N[i];
      g.lineTo(PX(q.x) - nv.x * hw, PY(q.y) + nv.y * hw);
    }
    g.closePath();
    g.lineJoin = "round"; g.lineCap = "round";
    g.strokeStyle = "#6f7a86"; g.lineWidth = Math.max(2.6, W * 0.006); g.stroke();
    g.strokeStyle = "rgba(255,255,255,.5)"; g.lineWidth = Math.max(1, W * 0.0018); g.stroke();

    /* A·B·C 표시 — 흰 테를 둘러 트랙 위에서도 또렷하게 보이게 한다 */
    var mks = [[tr.iA, "A"], [tr.iB, "B"], [tr.iC, "C"]], mr = Math.max(8, W * 0.018);
    for (i = 0; i < 3; i++) {
      q = pts[mks[i][0]]; qx = PX(q.x); qy = PY(q.y);
      g.fillStyle = "rgba(255,255,255,.9)";
      g.beginPath(); g.arc(qx, qy, mr * 1.22, 0, 6.2832); g.fill();
      g.fillStyle = "#0ea5e9";
      g.beginPath(); g.arc(qx, qy, mr, 0, 6.2832); g.fill();
      g.fillStyle = "#fff"; g.font = "800 " + Math.max(9, W * 0.021) + "px sans-serif";
      g.textAlign = "center"; g.textBaseline = "middle";
      g.fillText(mks[i][1], qx, qy);
    }

    /* 차량 — 진행 방향으로 기울인다. 화면은 y가 아래로 커지므로 vy의 부호를 뒤집는다.
       바퀴가 놓이는 국소 +y 쪽이 언제나 레일 면이라 루프에서도 자세가 맞는다 */
    var cxp = PX(f.x), cyp = PY(f.y);
    var ang = Math.atan2(-f.vy, f.vx);
    var cl = Math.max(19, W * 0.049), ch = Math.max(12, W * 0.029);
    g.save(); g.translate(cxp, cyp); g.rotate(ang);
    g.fillStyle = "#0d141d";
    g.beginPath(); g.arc(-cl * 0.26, ch * 0.42, ch * 0.22, 0, 6.2832); g.fill();
    g.beginPath(); g.arc(cl * 0.28, ch * 0.42, ch * 0.22, 0, 6.2832); g.fill();
    g.beginPath();
    g.moveTo(-cl * 0.5, -ch * 0.06);
    g.lineTo(-cl * 0.5, ch * 0.4);
    g.lineTo(cl * 0.2, ch * 0.44);
    g.quadraticCurveTo(cl * 0.52, ch * 0.36, cl * 0.5, -ch * 0.04);
    g.quadraticCurveTo(cl * 0.42, -ch * 0.3, cl * 0.12, -ch * 0.28);
    g.lineTo(-cl * 0.28, -ch * 0.26);
    g.closePath();
    var cgd = g.createLinearGradient(0, -ch * 0.5, 0, ch * 0.5);
    cgd.addColorStop(0, "#6f8399"); cgd.addColorStop(.5, "#3a4859"); cgd.addColorStop(1, "#1a232f");
    g.fillStyle = cgd; g.fill();
    g.strokeStyle = "#0b121b"; g.lineWidth = Math.max(1.4, W * 0.0030); g.stroke();
    /* 좌석 등받이와 앉은 사람 */
    g.fillStyle = "#a8724a";
    g.beginPath();
    g.moveTo(-cl * 0.46, -ch * 0.04); g.lineTo(-cl * 0.46, -ch * 0.5);
    g.lineTo(-cl * 0.28, -ch * 0.5); g.lineTo(-cl * 0.28, -ch * 0.04);
    g.closePath(); g.fill();
    g.fillStyle = "#1f2937";
    g.beginPath(); g.arc(-cl * 0.13, -ch * 0.36, ch * 0.19, 0, 6.2832); g.fill();
    g.fillStyle = "rgba(255,255,255,.34)";
    g.fillRect(-cl * 0.22, -ch * 0.02, cl * 0.62, Math.max(1, ch * 0.09));
    /* 창 한 칸 — 밝은 면을 넣어 작게 보여도 차량으로 읽히게 한다 */
    g.fillStyle = "#f0ead9";
    g.fillRect(cl * 0.02, -ch * 0.19, cl * 0.32, ch * 0.30);
    g.strokeStyle = "#0b121b"; g.lineWidth = Math.max(1, W * 0.0020);
    g.strokeRect(cl * 0.02, -ch * 0.19, cl * 0.32, ch * 0.30);
    g.restore();

    /* 화살표 — 위치·배율·색은 원본 그대로 둔다 */
    var k = Math.min(W, H) * 0.0075;
    arrow(g, cxp, cyp, f.vx * k * 0.9, -f.vy * k * 0.9, C.speed, Math.max(3, W * 0.008));
    arrow(g, cxp, cyp, f.ax * k, -f.ay * k, C.accel, Math.max(3, W * 0.008));
  }
};
/* ==========================================================================
   여기서부터가 이 파일만의 코드다 — 한 화면짜리 껍데기.
   저장(localStorage)을 쓰지 않는다. 채점하지 않는 5분 활동이고,
   저장 기능이 막힌 학교 PC 에서 스크립트가 멈추는 길을 아예 없앤다.
   ========================================================================== */

var built  = Rides.coaster.build();          /* 프레임 미리 계산 */
var FRAME  = built.dur / built.frames.length;  /* 한 프레임의 실제 시간(초) */
var idx    = 0;
var playing = false, raf = null, last = 0;

var scene   = document.getElementById("scene");
var cpoint  = document.getElementById("cpoint");
var btnPlay = document.getElementById("play");
var btnAgain = document.getElementById("restart");
var outA = document.getElementById("v-accel");
var outS = document.getElementById("v-speed");
var outT = document.getElementById("v-time");

/* ---- 롤러코스터 그리기 ---- */
function paint(){
  var f = built.frames[idx];
  outA.firstChild.nodeValue = Math.sqrt(f.ax * f.ax + f.ay * f.ay).toFixed(1);
  outS.firstChild.nodeValue = f.v.toFixed(1);
  outT.firstChild.nodeValue = f.t.toFixed(2);
  var fc = fitCanvas(scene);
  if (!fc) return false;                 /* 아직 크기가 없다 — 그리지 못했다 */
  Rides.coaster.draw(fc.g, fc.w, fc.h, f, {}, built);
  return true;
}

/* ---- C 지점 보기 그림 — 통합본 drawCPoint 와 같은 그림 ---- */
function drawCPoint(){
  var fc = fitCanvas(cpoint); if (!fc || !built.track) return false;
  var g = fc.g, W = fc.w, H = fc.h, tr = built.track;
  g.fillStyle = "#fff"; g.fillRect(0, 0, W, H);
  var best = built.frames[0], bd = 1e9, i;
  for (i = 0; i < built.frames.length; i++) {
    var dd = Math.abs(built.frames[i].i - tr.iC);
    if (dd < bd) { bd = dd; best = built.frames[i]; }
  }
  var cx = W * 0.36, cy = H * 0.5, R = Math.min(W, H) * 0.3;
  g.strokeStyle = "#cbd5e1"; g.lineWidth = Math.max(3, W * 0.012);
  g.beginPath(); g.arc(cx + R, cy, R, 0, 6.2832); g.stroke();
  g.fillStyle = "#0ea5e9";
  g.beginPath(); g.arc(cx, cy, Math.max(9, W * 0.022), 0, 6.2832); g.fill();
  g.fillStyle = "#fff"; g.font = "800 " + Math.max(10, W * 0.026) + "px sans-serif";
  g.textAlign = "center"; g.textBaseline = "middle"; g.fillText("C", cx, cy);
  var L = Math.min(W, H) * 0.26;
  [["㉠", 0, 1], ["㉡", 0.707, 0.707], ["㉢", 1, 0]].forEach(function(o){
    arrow(g, cx, cy, o[1] * L, o[2] * L, "#a5b4fc", Math.max(2.5, W * 0.008));
    g.fillStyle = "#6366f1"; g.font = "700 " + Math.max(11, W * 0.03) + "px sans-serif";
    g.textAlign = "center"; g.textBaseline = "middle";
    g.fillText(o[0], cx + o[1] * L * 1.28, cy + o[2] * L * 1.28);
  });
  var mag = Math.sqrt(best.ax * best.ax + best.ay * best.ay), k = L / mag;
  arrow(g, cx, cy, best.ax * k, -best.ay * k, C.accel, Math.max(3.5, W * 0.011));
  g.fillStyle = C.accel; g.font = "700 " + Math.max(10, W * 0.026) + "px sans-serif";
  g.textAlign = "left"; g.textBaseline = "top";
  g.fillText("계산한 가속도 " + mag.toFixed(1) + " m/s²", 10, 8);
  g.fillStyle = "#6b7280"; g.font = Math.max(9, W * 0.023) + "px sans-serif";
  g.fillText("수평에서 아래로 " + (Math.atan2(-best.ay, best.ax) * 180 / Math.PI).toFixed(0) + "°",
             10, 8 + Math.max(13, W * 0.032));
  return true;
}

/* ---- 재생 ---- */
function stop(){
  playing = false; last = 0;
  if (raf) { cancelAnimationFrame(raf); raf = null; }
}
function tick(ts){
  if (!playing) return;
  if (!last) last = ts;
  var dt = Math.min(0.05, (ts - last) / 1000);
  last = ts;
  idx += Math.max(1, Math.round(dt / FRAME));
  if (idx >= built.frames.length - 1) {
    idx = built.frames.length - 1;
    stop(); btnPlay.firstChild.nodeValue = "▶ 다시";
    paint(); return;
  }
  paint();
  raf = requestAnimationFrame(tick);
}
btnPlay.onclick = function(){
  if (idx >= built.frames.length - 1) idx = 0;   /* 끝났으면 처음부터 */
  if (playing) { stop(); btnPlay.firstChild.nodeValue = "▶ 이어서"; return; }
  playing = true; last = 0;
  btnPlay.firstChild.nodeValue = "⏸ 멈춤";
  raf = requestAnimationFrame(tick);
};
btnAgain.onclick = function(){
  stop(); idx = 0;
  btnPlay.firstChild.nodeValue = "▶ 시작";
  paint();
};

/* ---- ㉠·㉡·㉢ 고르기 — 고른 것이 눈에 띄게 ---- */
(function(){
  var labs = [document.getElementById("lab0"),
              document.getElementById("lab1"),
              document.getElementById("lab2")];
  function sync(){
    var i, r;
    for (i = 0; i < labs.length; i++) {
      r = labs[i].getElementsByTagName("input")[0];
      if (r.checked) labs[i].className = "on"; else labs[i].className = "";
    }
  }
  for (var i = 0; i < labs.length; i++) labs[i].onchange = sync;
})();

/* ---- 창 크기가 바뀌면 다시 그린다 ---- */
var reTimer = null;
window.onresize = function(){
  if (reTimer) clearTimeout(reTimer);
  reTimer = setTimeout(function(){ paint(); drawCPoint(); }, 120);
};

/* ---- 첫 그림 ----
   화면이 아직 자리를 잡지 않았으면(숨은 탭, 최소화된 창, 느린 PC)
   캔버스 폭이 0 이라 fitCanvas 가 null 을 돌려주고 그림이 통째로 비어 버린다.
   실제로 빈 화면이 나온 적이 있다. 그려질 때까지 버틴다. 지우지 마라. */
var drewScene = false, drewC = false, watch = null;
function drawAll(){
  if (paint())      drewScene = true;
  if (drawCPoint()) drewC = true;
  if (drewScene && drewC && watch) { clearInterval(watch); watch = null; }
  return drewScene && drewC;
}
if (!drawAll()) watch = setInterval(drawAll, 250);
if (window.addEventListener) {
  window.addEventListener("load", drawAll, false);
  document.addEventListener("visibilitychange", drawAll, false);
} else if (window.attachEvent) {
  window.attachEvent("onload", drawAll);
}
</script>
